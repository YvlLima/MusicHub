<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Moderação - Music Hub</title>

    <link rel="icon" type="image/png" href="imagens/favicon.png" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <!-- Proteção de Acesso ao Painel de Admin -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("token_jwt");
        const userStr = localStorage.getItem("utilizador_ativo");
        let user = null;

        try {
          user = JSON.parse(userStr);
        } catch (e) {
          user = null;
        }

        if (
          !token ||
          token === "undefined" ||
          token === "null" ||
          !user ||
          user === "undefined" ||
          user === "null" ||
          !user.is_admin ||
          user.is_admin === 0
        ) {
          localStorage.removeItem("token_jwt");
          localStorage.removeItem("utilizador_ativo");
          window.location.replace("login.html");
        }
      });
    </script>

    <!-- Barra de Progresso de Scroll -->
    <div id="barra-progresso"></div>

    <div id="hub-principal">
      <header>
        <div class="seletor-idioma">
          <select id="idioma-select" onchange="mudarIdioma(this.value)">
            <option value="pt">PT-PT</option>
            <option value="en">ENGLISH</option>
          </select>
        </div>

        <div class="logo-container">
          <svg
            class="logo-header"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 200 200"
            width="160"
            height="160"
          >
            <path
              d="M100 10 L115 85 L190 100 L115 115 L100 190 L85 115 L10 100 L85 85 Z"
              fill="#050505"
              stroke="#ff0033"
              stroke-width="3"
            />
            <path
              d="M100 50 L106 94 L150 100 L106 106 L100 150 L94 106 L50 100 L94 94 Z"
              fill="#ff0033"
            />
            <circle cx="100" cy="100" r="12" fill="#ffffff" />
            <circle cx="100" cy="100" r="5" fill="#000000" />
          </svg>
        </div>

        <h1 data-text="MODERAÇÃO" data-i18n="modPainelTitulo">
          PAINEL DE MODERAÇÃO
        </h1>

        <nav>
          <a href="index.html" data-i18n="modVoltarHub">← VOLTAR AO HUB</a>
        </nav>

        <div class="painel-controlo">
          <button
            class="btn-hud"
            data-i18n="adminBtnAtualizar"
            onclick="carregarCandidaturas()"
          >
            🔄 ATUALIZAR
          </button>
          <button
            class="btn-hud"
            data-i18n="btnLogout"
            onclick="terminarSessao()"
          >
            LOGOUT
          </button>
        </div>
      </header>

      <main>
        <section class="seccao">
          <h2 data-i18n="modSubmissoesTitulo">
            Candidaturas de Artistas/Álbuns
          </h2>

          <div class="controles-admin">
            <select id="filtro-status" onchange="carregarCandidaturas()">
              <option value="pendente" data-i18n="modFiltroPendente">
                ⏳ PENDENTES
              </option>
              <option value="todas" data-i18n="modFiltroTodas">📋 TODAS</option>
              <option value="aprovado" data-i18n="modFiltroAprovado">
                ✓ APROVADAS
              </option>
              <option value="rejeitado" data-i18n="modFiltroRejeitado">
                ✗ REJEITADAS
              </option>
            </select>
            <button
              type="button"
              class="btn-hud"
              data-i18n="modBtnRecarregar"
              onclick="carregarCandidaturas()"
            >
              🔄 RECARREGAR
            </button>
          </div>

          <div id="container-candidaturas" class="container-candidaturas">
            <p
              style="text-align: center; color: #888"
              data-i18n="modCarregando"
            >
              A carregar candidaturas...
            </p>
          </div>
        </section>
      </main>

      <!-- Modal para Rejeitar com Motivo -->
      <div id="modal-rejeicao" class="modal-overlay">
        <div class="caixa-modal-confirm">
          <h3 data-i18n="modModalRejeicaoTitulo">MOTIVO DA REJEIÇÃO</h3>

          <div class="campo-modal">
            <textarea
              id="motivo-rejeicao"
              data-i18n-placeholder="modPlaceholderMotivo"
              placeholder="Descreve o motivo da rejeição..."
              rows="4"
            ></textarea>
          </div>

          <div class="acoes-modal-confirm">
            <button
              type="button"
              class="btn-hud-modal"
              data-i18n="subBtnCancelar"
              onclick="fecharModalRejeicao()"
            >
              CANCELAR
            </button>
            <button
              type="button"
              class="btn-hud-modal btn-perigo"
              data-i18n="modBtnRejeitar"
              onclick="confirmarRejeicao()"
            >
              REJEITAR
            </button>
          </div>
        </div>
      </div>

      <!-- Modal para Visualizar Histórico -->
      <div id="modal-historico" class="modal-overlay">
        <div
          class="caixa-modal-confirm"
          style="max-width: 600px; max-height: 80vh; overflow-y: auto"
        >
          <h3 id="historico-titulo" data-i18n="modHistoricoTitulo">
            HISTÓRICO DE CANDIDATURA
          </h3>

          <div id="historico-corpo" style="text-align: left; margin-top: 20px">
            <!-- Conteúdo dinâmico aqui -->
          </div>

          <div class="acoes-modal-confirm" style="margin-top: 20px">
            <button
              type="button"
              class="btn-hud-modal"
              data-i18n="adminBtnExportarJson"
              onclick="fecharModalHistorico()"
            >
              FECHAR
            </button>
          </div>
        </div>
      </div>

      <footer>
        <p>© 2026 - MUSIC HUB</p>
        <div class="redes-sociais">
          <a
            href="https://guns.lol/yvllima36"
            target="_blank"
            class="botao-redes"
          >
            MADE BY
          </a>
        </div>
      </footer>

      <button id="btn-topo" onclick="voltarAoTopo()">↑</button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
      <span class="ponto-pisca"></span>
      <span id="toast-mensagem">NOTIFICAÇÃO</span>
    </div>

    <!-- Scripts JS -->
    <script src="js/translations.js"></script>
    <script src="js/index.js"></script>
    <script src="js/login.js"></script>
    <script src="js/admin-submissions.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const idiomaSalvo = localStorage.getItem("idioma_preferido") || "pt";
        const select = document.getElementById("idioma-select");
        if (select) select.value = idiomaSalvo;
        if (typeof aplicarTraducoes === "function") {
          aplicarTraducoes(idiomaSalvo);
        }
      });
    </script>
  </body>
</html>
