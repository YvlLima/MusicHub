<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Hub — Moderação de Quotes</title>

    <link rel="icon" type="image/png" href="imagens/favicon.png" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/admin-quotes.css" />
  </head>
  <body>
    <!-- Proteção de Acesso: só admins entram aqui -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("token_jwt");
        const userStr = localStorage.getItem("utilizador_ativo");

        if (
          !token ||
          token === "undefined" ||
          token === "null" ||
          !userStr ||
          userStr === "undefined" ||
          userStr === "null"
        ) {
          window.location.replace("login.html");
          return;
        }

        try {
          const user = JSON.parse(userStr);
          if (!user || !(user.is_admin > 0)) {
            window.location.replace("index.html");
          }
        } catch (e) {
          window.location.replace("login.html");
        }
      });
    </script>

    <div id="hub-principal">
      <header>
        <div class="seletor-idioma">
          <select id="idioma-select" onchange="mudarIdioma(this.value)">
            <option value="pt">PT-PT</option>
            <option value="en">ENGLISH</option>
          </select>
        </div>

        <div class="logo-container">
          <svg
            class="logo-header"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 200 200"
            width="120"
            height="120"
          >
            <path
              d="M100 10 L115 85 L190 100 L115 115 L100 190 L85 115 L10 100 L85 85 Z"
              fill="#050505"
              stroke="#ff0033"
              stroke-width="3"
            />
            <path
              d="M100 50 L106 94 L150 100 L106 106 L100 150 L94 106 L50 100 L94 94 Z"
              fill="#ff0033"
            />
            <circle cx="100" cy="100" r="12" fill="#ffffff" />
            <circle cx="100" cy="100" r="5" fill="#000000" />
          </svg>
        </div>

        <h1 data-text="MODERAÇÃO DE QUOTES" data-i18n="quotesPainelTitulo">
          MODERAÇÃO DE QUOTES
        </h1>

        <div class="painel-controlo">
          <button
            class="btn-hud"
            data-i18n="quotesVoltarHub"
            onclick="window.location.href = 'index.html'"
          >
            VOLTAR AO HUB
          </button>
          <button
            class="btn-hud"
            data-i18n="adminBtnAtualizar"
            onclick="carregarQuotesPendentes()"
          >
            🔄 ATUALIZAR
          </button>
        </div>
      </header>

      <main>
        <section class="seccao">
          <h2 data-i18n="quotesSecaoTitulo">QUOTES SUGERIDAS PENDENTES</h2>

          <div class="stats-admin-container">
            <div class="card-stat">
              <span class="stat-num" id="stat-total-pendentes">0</span>
              <span class="stat-label" data-i18n="quotesStatPendentes"
                >PENDENTES</span
              >
            </div>
          </div>

          <table class="tabela-admin tabela-quotes">
            <thead>
              <tr>
                <th data-i18n="quotesTabelaQuote">QUOTE</th>
                <th data-i18n="quotesTabelaArtista">ARTISTA</th>
                <th data-i18n="quotesTabelaCom">SUGERIDA POR</th>
                <th data-i18n="quotesTabelaData">DATA</th>
                <th data-i18n="quotesTabelaAcoes">AÇÕES</th>
              </tr>
            </thead>
            <tbody id="lista-quotes-pendentes-body">
              <!-- Injetado via JS -->
            </tbody>
          </table>
        </section>
      </main>

      <footer>
        <p>© 2026 - MUSIC HUB</p>
        <div class="redes-sociais">
          <a
            href="https://guns.lol/yvllima36"
            target="_blank"
            class="botao-redes"
          >
            MADE BY
          </a>
        </div>
      </footer>
    </div>

    <!-- Modal de Confirmação -->
    <div id="modal-confirmacao" class="modal-overlay">
      <div class="caixa-modal-confirm">
        <h3 id="modal-confirm-titulo">CONFIRMAÇÃO</h3>
        <p id="modal-confirm-texto">Tens a certeza que queres prosseguir?</p>

        <div class="acoes-modal-confirm">
          <button
            type="button"
            id="btn-modal-cancelar"
            class="btn-hud-modal"
            data-i18n="subBtnCancelar"
          >
            CANCELAR
          </button>
          <button
            type="button"
            id="btn-modal-confirmar"
            class="btn-hud-modal btn-perigo"
          >
            CONFIRMAR
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
      <span class="ponto-pisca"></span>
      <span id="toast-mensagem">LINK COPIADO COM SUCESSO</span>
    </div>

    <script src="js/config.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/index.js"></script>
    <script src="js/admin-quotes.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const idiomaSalvo = localStorage.getItem("idioma_preferido") || "pt";
        const select = document.getElementById("idioma-select");
        if (select) select.value = idiomaSalvo;
        if (typeof aplicarTraducoes === "function") {
          aplicarTraducoes(idiomaSalvo);
        }
      });
    </script>
  </body>
</html>
